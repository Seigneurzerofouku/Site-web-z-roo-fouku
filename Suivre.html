<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact DE SERVICE CHEZ DABILGOU </title>
    <style>
        p {
            color: blue;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <h1>📱CONTACT DE DABILGOU TELECOM </h1>
    <form id="loginForm">
        <label for="serviceSouhaite">SERVICE SOUHAITÉ:</label><br>
        <input type="text" id="serviceSouhaite" name="serviceSouhaite"><br>
        <label for="numeroService">Numéro de service :</label><br>
        <input type="text" id="numeroService" name="numeroService"><br>
        <input type="button" value="LANCER L'APPEL DE SERVICE" onclick="connexion()">
    </form>
    <p id="message"></p>

    <script>
        function connexion() {
            var serviceDemande = document.getElementById("serviceSouhaite").value;
            var numeroService = document.getElementById("numeroService").value;
            var message = document.getElementById("message");

            if (serviceDemande === "Réparation" && numeroService === "06355215") {
                message.innerHTML = "Dabilgou telecom recevra le message de votre besoin de service. " + serviceDemande + " 📱";
                message.style.color = "green";
            } else {
                message.innerHTML = "Désolé nous n'avons pas reçu votre message. Vérifiez si le numéro que vous avez contacté est vraiment le nôtre ou le service demandé est vraiment notre domaine.";
                message.style.color = "red";}
        }
    </script>
</body>
